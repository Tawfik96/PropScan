<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PropScan — Real Estate Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Upload spinner overlay -->
<div class="upload-overlay" id="uploadOverlay">
  <div class="spinner"></div>
  <div class="upload-text">UPLOADING CHAT…</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".txt" />

<!-- Top Bar -->
<header class="topbar">
  <div class="logo">Prop<span>Scan</span></div>
  <button class="btn-import" id="importBtn">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 3v10M6 9l4 4 4-4"/><path d="M3 15v1a2 2 0 002 2h10a2 2 0 002-2v-1"/>
    </svg>
    Import Chat
  </button>
</header>

<!-- AI Inquiry Box -->
<div class="inquiry-bar">
  <div class="inquiry-label">
    Paste a WhatsApp message to search
    <span class="ai-badge">Intresting Feature — COMING SOON</span>
  </div>
  <div class="inquiry-input-row">
    <textarea
      class="inquiry-textarea"
      id="inquiryInput"
      placeholder="e.g. «شقة 3 غرف في القاهرة الجديدة بحد أقصى 3 مليون» — paste a message and filters will update automatically"
      rows="2"
    ></textarea>
    <button class="btn-inquiry" disabled title="Coming soon">Apply</button>
  </div>
</div>

<!-- Filter Bar -->
<div class="filter-bar">
  <div class="filter-group">
    <label>Min ₤</label>
    <input type="number" id="f-price-min" placeholder="0" />
  </div>
  <div class="filter-group">
    <label>Max ₤</label>
    <input type="number" id="f-price-max" placeholder="Any" />
  </div>
  <div class="filter-group" style="max-width:110px;">
    <label>Beds</label>
    <select id="f-bedrooms">
      <option value="">Any</option>
      <option value="0">Studio</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5+</option>
    </select>
  </div>
  <div class="filter-group wide">
    <label>City</label>
    <select id="f-city">
      <option value="">Any</option>
    </select>
  </div>
  <div class="filter-group wide">
    <label>Deal</label>
    <select id="f-transaction">
      <option value="">Any</option>
      <option value="sale">Sale</option>
      <option value="rent">Rent</option>
      <option value="daily_rent">Daily Rent</option>
    </select>
  </div>
  <div class="filter-group wide">
    <label>Type</label>
    <select id="f-proptype">
      <option value="">Any</option>
      <option value="apartment">Apartment</option>
      <option value="villa">Villa</option>
      <option value="studio">Studio</option>
      <option value="duplex">Duplex</option>
      <option value="penthouse">Penthouse</option>
      <option value="chalet">Chalet</option>
      <option value="townhouse">Townhouse</option>
      <option value="office">Office</option>
      <option value="shop">Shop</option>
      <option value="land">Land</option>
      <option value="other">Other</option>
    </select>
  </div>
  <button class="btn-filter" id="searchBtn">Search</button>
  <button class="btn-reset" id="resetBtn">Reset</button>
</div>

<!-- Results header -->
<div class="results-header">
  <div class="results-count" id="resultsCount"></div>
</div>

<!-- Cards -->
<div class="cards-grid" id="cardsGrid"></div>

<script src="app.js"></script>

</body>
</html>
